// ============================================================
// COUNTER UAV - All Binds CFG File
// All binds written in +command format for CFG execution
// Usage: exec counter_uav_binds.cfg  OR  bind KEY +command
// ============================================================

// ── Omen Framework Binds (use menu to toggle) ──
// These binds are toggled via the in-game menu bind sliders.
// Set the bind key in the menu, then it activates automatically.
// Format: bind KEY "+actionslot X" (set via menu)

// ── Trust / WHITENOISE CFG Binds ──
// These are direct +command binds. Bind them in your config:
// Example: bind KEY "+nac"

// --- Weapon / OMA ---
bind KP_INS "+nac"
bind KP_END "+oma"
bind KP_DOWNARROW "+omashax"
bind KP_PGDN "+omabag"
bind KP_LEFTARROW "+tablet"
bind KP_5 "+invtab"
bind KP_RIGHTARROW "+opentab"
bind KP_HOME "+cowboy"

// --- Animation / Movement ---
bind KP_UPARROW "+smoothanim"
bind KP_PGUP "+glide"
bind KP_DEL "+anim"
bind KP_SLASH "+animtime"
bind KP_STAR "+sprintin"
bind KP_MINUS "+infsprint"
bind KP_PLUS "+cfgmelee"

// --- Combat ---
bind MWHEELUP "+canswap"
bind MWHEELDOWN "+canzoom"
bind SEMICOLON "+insta"
bind LEFTBRACKET "+gflip"
bind RIGHTBRACKET "+bolt"
bind BACKSLASH "+bounce"
bind COMMA "+copycat"
bind PERIOD "+houdini"
bind SLASH "+zoomload"

// --- Killstreaks ---
bind HOME "+ac130"
bind END "+stuck"
bind INSERT "+jam"
bind DELETE "+akimboglitch"
bind PGUP "+c4deto"
bind PGDN "+damrep"

// --- Model / Mode ---
bind F5 "+gmode"
bind F6 "+hmode"
bind F7 "+dmode"
bind F8 "+radmark"

// --- Pickup ---
bind F9 "+pickuprad"
bind F10 "+nopickuprad"
bind F11 "+enablefrag"
bind F12 "+disablefrag"

// --- Reload / Sprint ---
bind P "+marareload"
bind O "+adeliaglide"
bind I "+fastglide"

// --- Radiation ---
bind L "+raddam"

// ============================================================
// QUICK REFERENCE - ALL AVAILABLE +COMMANDS
// ============================================================
// +nac           - Nac Mod (quick weapon swap)
// +oma           - OMA Overlay (use bar animation)
// +omashax       - OMA Shax (take/give weapon with bar)
// +omabag        - OMA Bag (give OMA weapon)
// +tablet        - Predator Tablet (give pred missile)
// +invtab        - Invisible Tablet (harrier airstrike)
// +opentab       - Open Tablet (helicopter minigun)
// +cowboy        - Cowboy swap (Colt Anaconda)
// +smoothanim    - Smooth Animation bind
// +glide         - Glide animation
// +adeliaglide   - Adelia Glide (illusion + anim)
// +fastglide     - Fast Glide (illusion + anim + time 0)
// +anim          - Set weapon animation
// +animtime      - Set animation time
// +sprintin      - Sprint In animation
// +infsprint     - Infinite Sprint animation
// +cfgmelee      - Melee animation
// +marareload    - Mara Reload animation
// +canswap       - Canswap
// +canzoom       - Canzoom (illusion canswap)
// +insta         - Instaswap
// +gflip         - G-Flip (Cheytac swap)
// +bolt          - Bolt Movement
// +bounce        - Add Bounce (+1)
// +copycat       - Copycat (illusion)
// +houdini       - Houdini (disable/enable weapons)
// +zoomload      - Zoom Load animation
// +ac130         - AC130 toggle
// +stuck         - Semtex Stuck Message
// +jam           - Jam Radar (Counter UAV)
// +akimboglitch  - Akimbo Glitch
// +c4deto        - C4 Detonate
// +damrep        - Damage Rep feedback
// +radmark       - Rad Mark (headshot feedback)
// +raddam        - Radius Damage
// +gmode         - Ghillie Model
// +hmode         - Sniper Model
// +dmode         - Disguise Model (plastic case)
// +pickuprad     - Max Pickup Radius
// +nopickuprad   - Zero Pickup Radius
// +enablefrag    - Enable Weapons
// +disablefrag   - Disable Weapons
// +vel           - Velocity bind (from menu)
// ============================================================
